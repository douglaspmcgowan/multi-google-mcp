name: gitleaks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_ARCHIVE: gitleaks_8.30.1_linux_x64.tar.gz
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          release_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${GITLEAKS_ARCHIVE}"
          curl --fail --location --silent --show-error \
            --retry 3 --retry-all-errors \
            --output "${RUNNER_TEMP}/${GITLEAKS_ARCHIVE}" \
            "${release_url}"
          cd "${RUNNER_TEMP}"
          printf '%s  %s\n' "${GITLEAKS_SHA256}" "${GITLEAKS_ARCHIVE}" \
            | sha256sum --check --strict
          tar -xzf "${GITLEAKS_ARCHIVE}" gitleaks
          chmod 0755 gitleaks
          printf '%s\n' "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Scan full Git history
        shell: bash
        run: gitleaks git --redact --no-banner --log-opts="--all" .
